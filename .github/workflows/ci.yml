name: ci

# NOTE: first run 2026-11-01 on ubuntu-latest with Node 24: install, workflow check, 98 tests and the quick
# self-test passed. The 49-mutant check (about 36 minutes) is not run here; it was run locally on macOS with Node 26.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts keeps unrelated dependency install scripts from running;
      # sqlite3 is the one native module n8n needs, so it is rebuilt explicitly.
      - run: npm ci --ignore-scripts
      - run: npm rebuild sqlite3
      - run: npm run check:workflows
      - name: Tests against a real n8n (starts n8n on 5690 and mocks on 4700-4707)
        run: npm test
      - name: Mutation check self-test (planted hang must be killed, timeout is not a kill)
        run: npm run mutation:selftest -- --selftest-quick
